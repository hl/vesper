system_prompt: system_prompts/planner.md
token_budget: 100000
provider: anthropic
log_denied_calls: false
log_events: false
scratchpad: ".vesper/.scratchpad-planner.md"
skills: ".vesper/skills"

signals:
  complete: ".vesper-complete"
  needs_approval: ".vesper-needs-approval"
  failed: ".vesper-failed"

tools:
  read:
    - "docs/**"
    - "REQUIREMENTS.md"
    - "AGENTS.md"
    - "README.md"
  write:
    - "docs/plans/**"
    - ".vesper/.scratchpad-planner.md"
  delete:
    - "docs/plans/spec-queue.md"
  commands: []
  subagents: []
