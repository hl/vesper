system_prompt: system_prompts/builder.md
token_budget: 100000
provider: anthropic
log_denied_calls: false
log_events: false
command_timeout: 60
scratchpad: ".vesper/.scratchpad-builder.md"
skills: ".vesper/skills"
command_env: []

signals:
  complete: ".vesper-complete"
  needs_approval: ".vesper-needs-approval"
  failed: ".vesper-failed"

# context_management:
#   pruning: "off"                          # "always", "threshold", or "off"
#   pruning_threshold: 0.7                  # Prune when context exceeds this % of window
#   compaction_enabled: false               # Summarize conversation to free context
#   compaction_threshold: 0.8               # Compact when context exceeds this % of window
#   compaction_model: null                  # Model for compaction (null = use agent model)

tools:
  read:
    - "**"
  write:
    - "src/**"
    - "tests/**"
    - "config/**"
    - "docs/plans/task-queue.md"
    - ".vesper/.scratchpad-builder.md"
  delete:
    - "src/**"
    - "tests/**"
    - "docs/plans/task-queue.md"
  commands:
    - "make check"
    - "git commit"
  subagents: []
