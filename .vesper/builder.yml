system_prompt: builder.md
token_budget: 100000
log_denied_calls: false
log_events: false
command_timeout: 60
scratchpad: "docs/plans/.scratchpad-builder.md"
command_env: []

signals:
  complete: ".vesper-complete"
  needs_approval: ".vesper-needs-approval"
  failed: ".vesper-failed"

tools:
  read:
    - "**"
  write:
    - "src/**"
    - "test/**"
    - "config/**"
  delete:
    - "src/**"
    - "test/**"
    - "docs/plans/task-queue.md"
  commands:
    - "git commit"

completion:
  watch_file: "docs/plans/task-queue.md"
  no_progress_limit: 3
