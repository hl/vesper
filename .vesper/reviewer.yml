system_prompt: reviewer.md
token_budget: 100000
log_denied_calls: false
log_events: false

signals:
  complete: ".vesper-complete"
  needs_approval: ".vesper-needs-approval"
  failed: ".vesper-failed"

tools:
  read:
    - "**"
  write:
    - "docs/reviews/**"
  delete: []
  commands: []

completion:
  watch_file: ~
  no_progress_limit: 3
