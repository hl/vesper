# Agent configuration — see https://github.com/hl/vesper
# Copy this file and the matching system prompt to create your own agent.

system_prompt: system_prompts/example.md   # Relative to .vesper/
token_budget: 100000                       # Max tokens per run
provider: anthropic                        # "anthropic" or "openai"
# openai_api: responses                    # "responses" or "chat_completions" (OpenAI only)
# base_url: null                           # OpenAI-compatible server URL, e.g. llama.cpp /v1
# model: gpt-5.5                           # Optional; provider default when omitted
parallel_safe: false                       # Allows this child to run in parallel despite write/command access
max_tool_result_size: 50000                # Truncate tool results beyond this (bytes)
log_denied_calls: false                    # Log when a tool call is denied
log_events: false                          # Emit JSONL event stream to stderr
skills: ".vesper/skills"                   # Directory of skill .md files (null to disable)
scratchpad: ".vesper/.scratchpad.md"       # Persistent scratchpad file (null to disable)
context_files:                             # Project files appended to system prompt
  - CLAUDE.md

signals:
  complete: ".vesper-complete"             # Written on success; JSON when final output exists
  needs_approval: ".vesper-needs-approval" # Written when token budget exhausted
  failed: ".vesper-failed"                 # Written on failure

# context_management:
#   pruning: "off"                          # "always", "threshold", or "off"
#   pruning_threshold: 0.7                  # Prune when context exceeds this % of window
#   compaction_enabled: false               # Summarize conversation to free context
#   compaction_threshold: 0.8               # Compact when context exceeds this % of window
#   compaction_model: null                  # Model for compaction (null = use agent model)

# subagents:
#   parallel_same_turn: false               # Run same-turn subagent / Task calls concurrently
#   max_concurrency: 4                      # Max concurrent child agents when enabled
#   aggregate_token_budget: null            # Optional total child-token cap for one parent run

# mcp_servers:
#   jira:
#     command: "bun"                        # Local stdio MCP server executable
#     args: ["jira-mcp.mjs"]                # Optional argv
#     env: ["JIRA_TOKEN"]                   # Extra env vars passed to this server
#     allow_launch: true                    # Required explicit launch acknowledgement

tools:
  read:                                    # Glob patterns for read_file / list_files
    - "src/**"
    - "docs/**"
  write:                                   # Glob patterns for write_file / patch_file
    - "src/**"
  delete:                                  # Glob patterns for delete_file
    - "src/**"
  commands:                                # Allowed commands (binary or binary + first arg)
    - "bun test"
    - "git commit"
  subagents: []                            # Allowed Vesper agent names for subagent / Task dispatch
  mcp_read: []                             # Exact <server>.<tool> MCP read grants
  mcp_write: []                            # Exact <server>.<tool> MCP mutation grants
